<p-toolbar styleClass="mb-6">
    <ng-template #start>
        <p-button label="Agregar" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="openNew()" *ngIf="can('products:create')"/>
    </ng-template>

    <ng-template #end *ngIf="can('products:export')">
        <p-button class="mx-1" label="Exportar PDF" icon="pi pi-file-pdf" severity="secondary" (onClick)="exportPdf()"
            [loading]="loadingPdf" />
        <p-button class="mx-1" label="Exportar XLSX" icon="pi pi-file-excel" severity="secondary"
            (onClick)="exportXlsx()" [loading]="loadingXlsx" />
    </ng-template>
</p-toolbar>

<p-table #dt [value]="products()" [rows]="10" [columns]="cols" [paginator]="true"
    [globalFilterFields]="['name', 'user']" [tableStyle]="{ 'min-width': '75rem' }" [rowHover]="true" dataKey="id"
    currentPageReportTemplate="Mostrando {first} al {last} de {totalRecords} usuarios" [showCurrentPageReport]="true"
    [rowsPerPageOptions]="[10, 20, 30]" [loading]="loadingProducts">
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">Administrar Productos</h5>
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" [(ngModel)]="search" (keyup.enter)="onGlobalFilter()"
                    placeholder="Search..." />
            </p-iconfield>
        </div>
    </ng-template>
    <ng-template #header>
        <tr>
            <th style="min-width: 16rem">Código</th>
            <th pSortableColumn="name" style="min-width:16rem">
                Nombre
                <p-sortIcon field="name" />
            </th>
            <th pSortableColumn="price" style="min-width:16rem">
                Precio
                <p-sortIcon field="price" />
            </th>
            <th pSortableColumn="created_at" style="min-width: 8rem">
                Fecha de creación
                <p-sortIcon field="create_at" />
            </th>
            <th style="min-width: 12rem"></th>
        </tr>
    </ng-template>
    <ng-template #body let-product>
        <tr>
            <td style="min-width: 16rem">{{ product.product_code }}</td>
            <td style="min-width: 16rem">{{ product.name }}</td>
            <td style="min-width: 16rem">{{ product.price }}</td>
            <td style="min-width: 16rem">{{ product.created_at }}</td>
            <td>
                <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"
                    (click)="editProduct(product)" *ngIf="can('products:update')"/>
                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                    (click)="deleteProduct(product)" *ngIf="can('products:delete')"/>
            </td>
        </tr>
    </ng-template>
</p-table>

<new-product
[productDialog]="productDialog"
[product]="product()"
(closeDialog)="hideDialog()"
(showToast)="showToast($event)"
/>

<p-confirmdialog [style]="{ width: '450px' }" />

<p-toast />
